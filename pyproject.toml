[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everything-semantic-mcp"
version = "0.1.0"
description = "MCP server for voidtools Everything: pure-Python IPC (no es.exe/SDK DLL), local multilingual semantic search, and an index health self-check"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "yazzang-homelab" }]
keywords = ["mcp", "everything", "voidtools", "file-search", "semantic-search", "windows", "korean"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: File Managers",
    "Natural Language :: Korean",
    "Natural Language :: English",
]
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
semantic = ["model2vec>=0.6", "numpy>=1.26"]
dev = ["pytest>=8", "ruff>=0.4", "model2vec>=0.6", "numpy>=1.26"]

[project.scripts]
everything-semantic-mcp = "everything_semantic_mcp:main"

[project.urls]
Homepage = "https://github.com/yazzang-homelab/everything-semantic-mcp"
Issues = "https://github.com/yazzang-homelab/everything-semantic-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/everything_semantic_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/everything_semantic_mcp", "README.md", "README.en.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
